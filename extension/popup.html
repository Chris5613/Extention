<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unity Nodes Earnings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="hdr">
      <div class="brand">
        <div class="mark">U</div>
        <div class="title-group">
          <div class="title">Unity Earnings</div>
          <div class="subtitle" id="subtitle">No accounts yet</div>
        </div>
      </div>
      <div class="pill" id="summary-pill" data-state="missing">0 accounts</div>
    </header>

    <section class="hero">
      <div class="hero-label">TODAY'S EARNINGS • ALL ACCOUNTS</div>
      <div class="hero-value" id="today-usd">$0.000</div>
      <div class="hero-meta" id="today-meta">— accounts · — lifetime</div>
    </section>

    <section class="accounts" id="accounts-section">
      <div class="accounts-hdr">
        <span class="accounts-title">Accounts</span>
        <span class="accounts-count" id="accounts-count"></span>
      </div>
      <div class="accounts-list" id="accounts-list"></div>
      <div class="empty-state" id="empty-state" hidden>
        No accounts captured yet.<br />
        <a href="#" id="open-unity-empty" class="link">Open manage.unitynodes.io</a> and sign in,<br />
        or <a href="#" id="open-settings-empty" class="link">add one in Settings</a>.
      </div>
    </section>

    <div class="status-row">
      <div class="status" id="status">Ready.</div>
      <div class="last-sync" id="last-sync"></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="sync-btn">
        <span class="btn-label">Sync All</span>
      </button>
      <button class="btn ghost" id="settings-btn">Settings</button>
    </div>

    <footer class="foot">
      <a href="#" id="open-unity" class="link">Open Unity Nodes →</a>
      <span class="version">v1.2.1</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
