<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unity Nodes Earnings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="hdr">
      <div class="brand">
        <div class="mark">U</div>
        <div class="title-group">
          <div class="title">Unity Earnings</div>
          <div class="subtitle" id="email">Not signed in</div>
        </div>
      </div>
      <div class="pill" id="token-pill" data-state="missing">No token</div>
    </header>

    <section class="hero">
      <div class="hero-label">TODAY'S EARNINGS</div>
      <div class="hero-value" id="today-usd">$0.000</div>
      <div class="hero-meta" id="today-meta">— payouts · — devices</div>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">BALANCE</div>
        <div class="stat-value" id="balance">$—</div>
      </div>
      <div class="stat">
        <div class="stat-label">LIFETIME</div>
        <div class="stat-value" id="lifetime">$—</div>
      </div>
      <div class="stat">
        <div class="stat-label">DATE</div>
        <div class="stat-value" id="date">—</div>
      </div>
    </section>

    <div class="status-row">
      <div class="status" id="status">Ready.</div>
      <div class="last-sync" id="last-sync"></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="sync-btn">
        <span class="btn-label">Sync Now</span>
      </button>
      <button class="btn ghost" id="settings-btn">Settings</button>
    </div>

    <footer class="foot">
      <a href="#" id="open-unity" class="link">Open Unity Nodes →</a>
      <span class="version">v1.1.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
